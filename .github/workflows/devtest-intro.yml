name: DEVTEST intro browser checks
on:
  push:
    branches: [forge/issue-49-devtest-intro]
permissions:
  contents: read
jobs:
  intro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/intro" playwright@1.56.1
      - run: "$RUNNER_TEMP/intro/node_modules/.bin/playwright install --with-deps chromium"
      - run: NODE_PATH="$RUNNER_TEMP/intro/node_modules" node route127/devtest/tests/intro_browser.cjs
