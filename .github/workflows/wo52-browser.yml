name: WO52 DEVTEST browser smoke
on:
  push:
    branches: [forge/wo52-browser-smoke]
permissions:
  contents: read
jobs:
  results:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/wo52" playwright@1.56.1
      - run: npm exec --prefix "$RUNNER_TEMP/wo52" -- playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          NODE_PATH="$RUNNER_TEMP/wo52/node_modules" node route127/devtest/tests/wo52_browser.cjs
