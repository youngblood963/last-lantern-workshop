<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA ONLY — Route 127 — Factory Playtest v54.1 — Audit Candidate</title>
  <link rel="stylesheet" href="styles.css?v=50">
</head>
<body>
  <main class="terminal-shell">
    <div class="terminal-header">
      <span>ROUTE 127 // LOCAL NODE</span>
      <span id="signal">NO SIGNAL</span>
    </div>

    <div id="live-map" class="live-map" aria-label="Live area map" hidden></div>

    <section id="hud" class="hud hidden" aria-label="Player status">
      <span>LV <b id="hud-level">01</b></span>
      <span>HP <b id="hud-hp">100/100</b></span>
      <span>XP <b id="hud-xp">0/100</b></span>
      <span>BOLTS <b id="hud-bolts">12</b></span>
      <span>TURNS <b id="hud-turns">50/150</b></span>
      <span>REFILL <b id="hud-refill">24:00:00</b></span>
      <span>PACK <b id="hud-pack">2/8</b></span>
      <span>TIME <b id="hud-time">DAY</b></span>
    </section>

    <div class="game-layout">
      <section id="screen" class="screen" aria-live="polite"></section>
      <aside id="utility-panel" class="utility-panel hidden" aria-label="Quick controls">
        <div class="utility-name">--- <span id="side-level">LV 01</span></div>
        <div class="utility-stat">HP <span id="side-hp">100 / 100</span></div>
        <div class="utility-stat" id="side-xp" hidden></div>
        <div class="utility-stat">BOLTS <span id="side-bolts">12</span></div>
        <div class="utility-stat">INV <span id="side-inv">0/8</span></div>
        <div class="utility-stat">TURNS <span id="side-turns">50 / 150</span></div>
        <div class="utility-stat">TIME <span id="side-time">DAY</span></div>
        <div class="utility-stat">REFILL <span id="side-refill">24:00:00</span></div>
        <button type="button" data-command="status">(S) STATUS</button>
        <button type="button" data-command="inventory">(I) INVENTORY</button>
        <button type="button" data-command="map">(M) MAP</button>
        <button type="button" data-command="quests">(Q) QUESTS</button>
        <button type="button" data-command="save current">(V) SAVE CURRENT</button>
      </aside>
    </div>

    <form id="command-form" class="command-form" autocomplete="off">
      <span class="prompt">&gt;</span>
      <input id="command" type="text" aria-label="Command" autofocus spellcheck="false">
    </form>
    <div id="transmission" class="transmission" aria-hidden="true">
      <img src="transmission.png" alt="">
    </div>
  </main>

  <script>window.ROUTE127_QA_BUILD=true;</script>
  <script src="app.js?v=55.5"></script>
  <script src="casino.js?v=55.5"></script>
  <script src="polish.js?v=55.5"></script>
  <script src="expansion.js?v=55.5"></script>
  <script src="crime.js?v=55.5"></script>
<script src="consolidation.js?v=55.5"></script>
<script src="factory.js?v=55.5"></script>
<script src="seaport.js?v=55.5"></script>
<script src="wanderer_fix.js?v=55.5"></script>
<script src="v55.js?v=55.5"></script>
</body>
</html>
