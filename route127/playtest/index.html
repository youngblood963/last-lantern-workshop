  (()=>{
    let first=null;
    function report(message){
      if(first)return;first=String(message).slice(0,360);
      const show=()=>{
        if(document.getElementById('playtest-startup-error'))return;
        const box=document.createElement('div');box.id='playtest-startup-error';
        box.setAttribute('role','alert');
        box.style.cssText='position:fixed;z-index:2147483647;top:8px;left:8px;right:8px;padding:12px;background:#270d0d;color:#fff;border:2px solid #f88;font:14px/1.4 monospace;white-space:pre-wrap';
        box.textContent='PLAYTEST STARTUP ERROR (your save is untouched):\\n'+first;
        (document.body||document.documentElement).appendChild(box);
      };
      if(document.body)show();else document.addEventListener('DOMContentLoaded',show,{once:true});
    }
    window.addEventListener('error',e=>{
      if(e.target&&e.target!==window&&e.target.tagName==='SCRIPT')report('Script failed to load: '+(e.target.getAttribute('src')||'inline'));
      else if(e.error||e.message)report((e.message||String(e.error))+' @ '+(e.filename||'?')+':'+(e.lineno||'?'));
    },true);
    window.addEventListener('unhandledrejection',e=>report('Promise rejected: '+String(e.reason)));
  })();

<script id="seaport-slots-20261105">
/* DEVTEST: Seaport slot machine reuses Solace odds, payouts, and reel spin technique. */
(function(){
'use strict';
if(globalThis.ROUTE127_ENV?.name!=='PLAYTEST'||typeof GraphicalUI==='undefined'||typeof r6Round!=='function'||typeof casinoSlotDraw!=='function')return;
const names=['SCRAP','BOLTS','LANTERN','SKULL','RAT','BLACKGLASS'];
const base='../devtest/assets/locations/slots/';
const asset=f=>typeof ROUTE127_ASSET_BASE!=='undefined'&&ROUTE127_ASSET_BASE?new URL(base+f,ROUTE127_ASSET_BASE).href:base+f;
const wall=asset('seaport_slots_background.png'),cabinet=asset('seaport_slot_machine.png'),strip=asset('seaport_slot_reel_strip.png?v=wo-slots-reels-final-20261105');
const isSlot=()=>stage==='r6Casino'&&r6Round()?.game==='SLOTS'&&player.flags?.port55Casino;
const enabled=()=>GraphicalUI.preference()==='graphics'&&isSlot();
const d=R6_GAMES.indexOf("CAPTAIN'S DICE");if(d!==-1&&!R6_GAMES.includes('SLOTS'))R6_GAMES.splice(d,1,'SLOTS');
const wager=r6Wager;
r6Wager=function(bet){
 if(!isSlot())return wager.apply(this,arguments);
 if(!Number.isSafeInteger(bet)||bet<1||bet>Math.floor((Number.MAX_SAFE_INTEGER-player.bolts)/300))return false;
 const round=r6Round(),ok=wager.apply(this,arguments);
 if(!ok)return false;
 round.reels=[casinoSlotDraw(),casinoSlotDraw(),casinoSlotDraw()];
 r6Settle(casinoSlotPayout(round.reels,bet),round.reels.join(' / '));
 r6CasinoRender();return true;
};
// Same native clickable buttons used by the working Solace casino.
// These choices are derived from the casino round, not an asynchronous
// terminal output queue (which previously left the slot UI with no buttons).
// Slot-only fixed stakes; other casino games retain their own betting menus.
const slotActions=()=>['WAGER 10','WAGER 20','WAGER 50','BACK'];
const slotOptions=()=>slotActions().map((command,i)=>({
 key:String(i+1),command:command.toLowerCase(),
 label:command.replace(/^WAGER /,'Wager ')
}));
function slotChoices(){
 numberedChoices=Object.fromEntries(slotOptions().map(c=>[c.key,c.command]));
 currentHotkeys={b:'back'};
 GraphicalUI.schedule();
}
const oldChoices=GraphicalUI.choices;
GraphicalUI.choices=function(){
 return enabled()?slotOptions():oldChoices.call(this);
};
// Native button component, but dispatch the resolved command itself so
// stale numbered-choice registrations cannot route a click elsewhere.
const oldDispatch=GraphicalUI.dispatch;
GraphicalUI.dispatch=async function(choice){
 if(!enabled())return oldDispatch.call(this,choice);
 const current=slotOptions().find(c=>c.key===choice.key&&c.command===choice.command);
 if(!current||busy)return false;
 this.navOpen=false;
 await handleCommand(current.command);
 this.sync();
 return true;
};
// On a settled Seaport spin, choosing a wager starts the next round directly.
const originalCasinoCommand=r6CasinoCommand;
r6CasinoCommand=function(cmd){
 if(isSlot()&&r6Round()?.status==='settled'&&
   (/^wager (?:10|20|50)$/.test(cmd))){
  r6Open('SLOTS');
 }
 return originalCasinoCommand.apply(this,arguments);
};
const render=r6CasinoRender;
r6CasinoRender=function(){
 if(!isSlot())return render.apply(this,arguments);
 const r=r6Round();
 add('RUSTY ANCHOR — SLOTS','place');
 if(r.status==='waiting'){
  add('Match three: Bolt 10x / Crab 18x / Compass 28x / Chest 50x / Anchor 70x / Mermaid 300x.','system');
  slotChoices();
 }else if(r.status==='settled'){
  add('WAGER '+r.bet+' / RETURN '+r.payout+' / NET '+(r.payout-r.bet)+' Bolts','reward');
  slotChoices();
 }else render.apply(this,arguments);
};
const model=GraphicalUI.model;
GraphicalUI.model=function(){
 const m=model.apply(this,arguments);
 if(enabled()){m.layout='seaport-slots';m.art='';m.title='Rusty Anchor — Slots'}
 return m;
};
const style=document.createElement('style');
style.textContent=[
 'body.full-graphics .gfx-frame[data-layout="seaport-slots"] .gfx-main{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;gap:6px}',
 'body.full-graphics .gfx-frame[data-layout="seaport-slots"] .gfx-art{display:block!important;position:relative;flex:1 1 0;min-height:150px;overflow:hidden;background:#241b17 url("'+wall+'") center/cover no-repeat!important}',
 'body.full-graphics .gfx-frame[data-layout="seaport-slots"] .gfx-art-caption,body.full-graphics .gfx-frame[data-layout="seaport-slots"] .gfx-art-error,body.full-graphics .gfx-frame[data-layout="seaport-slots"] .gfx-image{display:none!important}',
 'body.full-graphics .gfx-frame[data-layout="seaport-slots"] .gfx-narrative{flex:0 0 auto;max-height:68px;overflow:auto}',
 'body.full-graphics .gfx-frame[data-layout="seaport-slots"] .gfx-choices{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:125px;overflow-y:auto}',
 'body.full-graphics .gfx-frame[data-layout="seaport-slots"] .gfx-choice{min-width:0;min-height:40px;padding:3px 7px}',
 '.r127-seaport-slot-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;isolation:isolate}',
 '.r127-seaport-slot-cabinet{position:relative;height:100%;max-width:100%;aspect-ratio:3/2;flex:none;background:url("'+cabinet+'") center/100% 100% no-repeat;filter:drop-shadow(0 5px 10px #000b)}',
 '.r127-seaport-slot-window{position:absolute;top:29%;height:36.5%;width:16%;overflow:hidden;border-radius:6px;background:#a38865;box-shadow:inset 0 0 8px 3px #120a08}',
 '.r127-seaport-slot-window[data-reel="0"]{left:23.7%}',
 '.r127-seaport-slot-window[data-reel="1"]{left:42.5%}',
 '.r127-seaport-slot-window[data-reel="2"]{left:59.8%}',
 '.r127-seaport-slot-scroll{position:absolute;left:0;top:0;width:100%;will-change:transform}',
 '.r127-seaport-slot-symbol{width:100%;background-repeat:no-repeat;background-position-x:center;box-sizing:border-box}',
 '.r127-seaport-slot-glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0007,transparent 18%,#fff2 50%,transparent 82%,#0007);box-shadow:inset 0 7px 9px #180e09,inset 0 -7px 9px #180e09}',
 '.r127-seaport-slot-stage.win .r127-seaport-slot-window{filter:brightness(1.23)}',
 '@media(prefers-reduced-motion:reduce){.r127-seaport-slot-scroll{will-change:auto}}'
].join('\n');
document.head.appendChild(style);
let key='',running=[];
function stop(){running.forEach(a=>{try{a.cancel()}catch(e){}});running=[]}
function create(figure){
 const scene=document.createElement('div');scene.className='r127-seaport-slot-stage';scene.setAttribute('role','img');scene.setAttribute('aria-label','Rusty Anchor slot machine');
 const machine=document.createElement('div');machine.className='r127-seaport-slot-cabinet';
 for(let i=0;i<3;i++){
  const windowEl=document.createElement('div');windowEl.className='r127-seaport-slot-window';windowEl.dataset.reel=i;
  const scroll=document.createElement('div');scroll.className='r127-seaport-slot-scroll';
  // Repeat six equal-height view cells. Source artwork icons have uneven
  // natural centers, so each cell crops its own icon without stretching.
  for(let copy=0;copy<5;copy++)for(let index=0;index<6;index++){
   const cell=document.createElement('div');
   cell.className='r127-seaport-slot-symbol';cell.dataset.symbol=String(index);
   cell.style.backgroundImage='url("'+strip+'")';
   scroll.appendChild(cell);
  }
  const glass=document.createElement('div');glass.className='r127-seaport-slot-glass';
  windowEl.append(scroll,glass);machine.append(windowEl);
 }
 scene.append(machine);figure.append(scene);return scene;
}
// The new 1024 x 1536 image has six pictograms with slightly uneven
// visual-center spacing. Align every icon to the center of its equal-height
// cell instead of assuming the artwork was a perfect 6 x 256 sprite grid.
const artworkCenters=[157,383,621,857,1063,1321];
const artworkRatio=1024/1536;
function cellHeight(win){return win.getBoundingClientRect().height/3}
function sizeCells(win){
 const cell=cellHeight(win),fullHeight=cell*6,fullWidth=fullHeight*artworkRatio;
 for(const icon of win.querySelectorAll('.r127-seaport-slot-symbol')){
  const idx=Number(icon.dataset.symbol);
  icon.style.height=cell+'px';
  icon.style.backgroundSize=fullWidth+'px '+fullHeight+'px';
  icon.style.backgroundPositionY=(cell/2-artworkCenters[idx]*fullHeight/1536)+'px';
 }
}
function top(win,index,loop){
 const cell=cellHeight(win),height=win.getBoundingClientRect().height;
 return height/2-((loop*6+index+.5)*cell);
}
function pose(scene,ids){
 [...scene.querySelectorAll('.r127-seaport-slot-window')].forEach((win,i)=>{
  sizeCells(win);
  // Loop 2 leaves full preceding/following cells; no visible strip ends.
  win.querySelector('.r127-seaport-slot-scroll').style.transform=
    'translate3d(0,'+top(win,ids[i],2)+'px,0)';
 });
}
function spin(scene,reels){
 const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
 const wins=[...scene.querySelectorAll('.r127-seaport-slot-window')];
 if(reduced||!Element.prototype.animate){pose(scene,reels.map(x=>names.indexOf(x)));return}
 wins.forEach((w,i)=>{
  sizeCells(w);
  const s=w.querySelector('.r127-seaport-slot-scroll'),from=top(w,0,1),to=top(w,names.indexOf(reels[i]),3);
  s.style.transform='translate3d(0,'+to+'px,0)';
  running.push(s.animate([{transform:'translate3d(0,'+from+'px,0)'},{transform:'translate3d(0,'+to+'px,0)'}],{duration:1450+i*420,easing:'cubic-bezier(.16,.82,.28,1)',fill:'none'}));
 });
}
function refresh(){
 const figure=GraphicalUI.element?.figure;if(!figure)return;
 let scene=figure.querySelector('.r127-seaport-slot-stage');
 if(!enabled()){if(scene)scene.remove();key='';stop();return}
 if(!scene){scene=create(figure);key=''}

<script id="playtest-slot-stakes-and-odds">
/* DEVTEST ONLY — fixed slot wagers and doubled matching-symbol odds.
 * Existing reels, images, animations, multipliers and settlements remain in place.
 */
(()=>{
 'use strict';
 if(globalThis.ROUTE127_ENV?.name!=='PLAYTEST'||typeof casinoSlotPayout!=='function'||typeof SLOT_SYMBOLS==='undefined')return;
 const permitted=new Set([10,20,50]);
 const solace=()=>stage==='mercy'&&mercyLocation==='casinoGame'&&casinoRound()?.game==='slots';
 const seaport=()=>stage==='r6Casino'&&r6Round()?.game==='SLOTS';
 const allowedCommand=cmd=>/^(?:wager|bet) (?:10|20|50)(?: bolts?)?$/.test(cmd);
 const prohibited=cmd=>/^(?:custom(?: wager)?|all in|c|a|[0-9]+|(?:wager|bet)\s+\d+(?:\s+bolts?)?)$/.test(cmd);
 // P(triple symbol)=P(symbol)^3. On a calibrated portion of losing
 // spins, promote to a triple with the natural relative symbol weights.
 // This doubles the win probability for each of the six symbols.
 const total=SLOT_SYMBOLS.reduce((sum,s)=>sum+s.weight,0);
 const triples=SLOT_SYMBOLS.map(s=>Math.pow(s.weight/total,3));
 const natural=triples.reduce((sum,p)=>sum+p,0);
 const promote=natural/(1-natural);
 const originalPayout=casinoSlotPayout;
 casinoSlotPayout=function(reels,bet){
  if(Array.isArray(reels)&&reels.length===3&&Number.isSafeInteger(bet)&&bet>0
     &&!reels.every(v=>v===reels[0])&&Math.random()<promote){
   let draw=Math.random()*natural;
   let winner=SLOT_SYMBOLS.length-1;
   for(let i=0;i<triples.length;i++){draw-=triples[i];if(draw<0){winner=i;break;}}
   reels.fill(SLOT_SYMBOLS[winner].name);
  }
  return originalPayout.apply(this,arguments);
 };
 // Restrict the shared Solace wager UI only for slots (not blackjack etc).
 const oldSolaceMenu=casinoWagerMenu;
 casinoWagerMenu=function(){
  if(!solace())return oldSolaceMenu.apply(this,arguments);
  outputQueue=outputQueue.then(()=>{
   currentHotkeys={b:'back'};
   numberedChoices={10:'wager 10',20:'wager 20',50:'wager 50'};
   usedHotkeys=new Set(['b']);
   for(const label of ['[10] 10 BOLTS','[20] 20 BOLTS','[50] 50 BOLTS','[B] BACK'])addImmediate(label,'system');
   followOutput();
  });
 };
 const oldSolaceWager=casinoWager;
 casinoWager=function(cmd,r){
  if(r?.game==='slots'&&!allowedCommand(String(cmd).trim().toLowerCase()))return false;
  return oldSolaceWager.apply(this,arguments);
 };
 const oldSolaceCommand=handleCasinoCommand;
 handleCasinoCommand=function(cmd){
  cmd=String(cmd).trim().toLowerCase();
  if(solace()){
   const r=casinoRound();
   delete r.custom;delete r.allInEven;
   if(prohibited(cmd)&&!allowedCommand(cmd)){
    add('SLOTS — CHOOSE WAGER 10, WAGER 20, OR WAGER 50.','system');
    casinoRender();return true;
   }
  }
  return oldSolaceCommand.apply(this,arguments);
 };
 const oldPortWager=r6Wager;
 r6Wager=function(bet){
  if(seaport()&&!permitted.has(bet))return false;
  return oldPortWager.apply(this,arguments);
 };
 const oldPortCommand=r6CasinoCommand;
 r6CasinoCommand=function(cmd){

 };
})();

<script>
/* DEVTEST recovery for an encounter already charged to the current road step. */
(()=>{
'use strict';
if(globalThis.ROUTE127_ENV?.name!=='PLAYTEST')return;

const resumeCommand='resume road event';
const skipCommand='skip stalled event';
const pendingRoad=()=>stage==='lanternRoad'&&lanternEdge()&&lanternState()?.pending;
const originalRoadMenu=lanternRoadMenu;
lanternRoadMenu=function(...args){
 if(!lanternEdge()||!lanternState()?.pending)return originalRoadMenu.apply(this,args);
 stage='lanternRoad';
 add(lanternProgressText(),'system');
 r5DirectChoices([resumeCommand.toUpperCase(),skipCommand.toUpperCase()]);
};

function restore(){
 if(!pendingRoad()||busy||combatState)return false;
 const g=lanternState();
 try{
  if(g.encounterIndex!=null&&(!Number.isInteger(g.encounterIndex)||
     !r10Pool(g.encounterRegion||lanternEdge().region)[g.encounterIndex])){
   throw Error('Saved encounter index is unavailable in '+(g.encounterRegion||lanternEdge().region));
  }
  resumeSavedEncounter=Number.isInteger(g.encounterIndex);
  roadTurnCharged=true;
  stage='between';
  showEncounter();
  if(stage==='between')throw Error('Encounter did not open a gameplay menu.');
  return true;
 }catch(error){
  resumeSavedEncounter=false;
  console.error('[DEVTEST road] Resume Road Event failed',error);
  if(!!lanternState()?.pending){
   add('This road event could not be reopened. Use Skip Stalled Event to recover this step.','danger');
   lanternRoadMenu();
  }
  return false;
 }finally{
  GraphicalUI.schedule();
 }
}

function skipStalledEvent(){
 if(!pendingRoad()||busy||combatState)return false;
 if(!confirm('Back up this DEVTEST save and skip the current event? This spends no additional turns.'))return false;
 try{
  const cloud=document.body.classList.contains('r127-cloud-game');
  const snapshot=saveSnapshot();
  const key='route127_devtest_stalled_road_backup_'+(cloud?snapshot.player.characterId+'_':'')+Date.now();
  const raw=cloud?JSON.stringify(snapshot):localStorage.getItem(FACTORY_AUTOSAVE_KEY);
  if(!raw)throw Error('No autosave found for backup.');
  localStorage.setItem(key,raw);
  if(localStorage.getItem(key)!==raw)throw Error('Autosave backup verification failed.');
  const g=lanternState();
  snapshot.stage='lanternRoad';
  Object.assign(snapshot.player.flags.lanternTravel,{pending:false,encounterIndex:null});
  for(const flag of ['devFoodChoice','devFoodSelected','r127StalledRoadEvent']){
   delete snapshot.player.flags[flag];
  }
  const updated=JSON.stringify({...snapshot,manualSlot:activeSaveSlot});
  if(!cloud){
   localStorage.setItem(FACTORY_AUTOSAVE_KEY,updated);
   if(localStorage.getItem(FACTORY_AUTOSAVE_KEY)!==updated)throw Error('Recovered save could not be verified.');
  }
  Object.assign(g,{pending:false,encounterIndex:null});
  for(const flag of ['devFoodChoice','devFoodSelected','r127StalledRoadEvent'])delete player.flags[flag];
  resumeSavedEncounter=false;
  lanternRoadMenu();
  if(cloud)v49Autosave();
  return true;
 }catch(error){
  console.error('[DEVTEST road] Skip Stalled Event failed',error);
  add('Recovery failed: '+error.message,'danger');
  if(pendingRoad())lanternRoadMenu();
  return false;
 }finally{
  GraphicalUI.schedule();
 }
}

const previousLoad=loadGame;
loadGame=function(slot=activeSaveSlot){
 const read=getSaveData;
 getSaveData=function(which){
  const data=read(which);
  const graph=data?.player?.flags?.lanternTravel;
  if(which===slot&&graph?.currentEdgeId&&graph.pending&&
     !data.combatState&&['between','encounter'].includes(data.stage)){
   return {...data,stage:'lanternRoad'};
  }
  return data;
 };
 let result;
 try{
  result=previousLoad.call(this,slot);
 }finally{
  getSaveData=read;
 }
 if(pendingRoad()&&Number.isInteger(lanternState().encounterIndex))restore();
 return result;
};

const previousCommand=handleCommand;
handleCommand=async function(raw){
 if(!pendingRoad())return previousCommand.apply(this,arguments);
 const command=String(r5Mapped(raw)||raw).trim().toLowerCase();
 if(command===resumeCommand)return restore();
 if(command===skipCommand)return skipStalledEvent();
 if(command==='continue road'||command==='reverse direction')return lanternRoadMenu();
 return previousCommand.apply(this,arguments);
};
const previousChoices=GraphicalUI.choices;
GraphicalUI.choices=function(...args){
 if(!pendingRoad()||combatState)return previousChoices.apply(this,args);
 return [
  {key:'1',command:resumeCommand,label:'Resume Road Event'},
  {key:'2',command:skipCommand,label:'Skip Stalled Event (no extra turn)'}
 ];
};
const previousDispatch=GraphicalUI.dispatch;
GraphicalUI.dispatch=async function(choice){
 if(!pendingRoad()||![resumeCommand,skipCommand].includes(choice?.command)){
  return previousDispatch.apply(this,arguments);
 }
 if(busy||commandProcessing||combatState)return false;
 const result=await handleCommand(choice.command);
 this.sync();
 return result;
};
globalThis.Route127RoadLoadRecovery=Object.freeze({restore,skipStalledEvent});
})();
</script>
