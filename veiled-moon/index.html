<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#090713">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Veiled Moon"
  >

  <title>The Veiled Moon Oracle</title>

  <!-- Browser favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/Favicon.png"
  >

  <!-- Progressive Web App -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
  >

  <!-- Main stylesheet -->
  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <div id="app"></div>

  <!-- Audio -->
  <audio
    id="ambient"
    loop
  ></audio>

  <audio
    id="shuffle"
    preload="auto"
    src="audio/classic_card_shuffle.mp3"
  ></audio>

  <!-- Oracle data -->
  <script src="data.js"></script>

  <!-- Main application -->
  <script src="app.js"></script>

</body>

</html>
